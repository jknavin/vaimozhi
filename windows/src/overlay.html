<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Inter", "Segoe UI", "Nirmala UI", sans-serif; user-select: none; }
  .pill {
    position: absolute; inset: 6px; border-radius: 999px; display: flex; align-items: center; gap: 12px; padding: 0 18px;
    background: rgba(20, 24, 42, 0.92); border: 1px solid rgba(255,255,255,.14); color: #fff;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ef5d6c; box-shadow: 0 0 0 0 rgba(239,93,108,.7); animation: pulse 1.4s infinite; flex: none; }
  .pill.work .dot { background: #20c9b7; animation: spin 1s linear infinite; box-shadow: none; border-radius: 3px; }
  .pill.error .dot { background: #f5b942; animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(239,93,108,0); } 100% { box-shadow: 0 0 0 0 rgba(239,93,108,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  canvas { flex: 1; height: 34px; min-width: 0; }
  #t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; width: 42px; text-align: right; flex: none; }
  #msg { font-size: 12.5px; line-height: 1.25; flex: 1; }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="dot"></div>
    <canvas id="c" width="160" height="34"></canvas>
    <div id="msg" style="display:none"></div>
    <div id="t">00:00</div>
  </div>
<script>
  const { listen } = window.__TAURI__.event;
  const pill = document.getElementById('pill'), msg = document.getElementById('msg');
  const c = document.getElementById('c'), g = c.getContext('2d'), t = document.getElementById('t');
  const bars = new Array(32).fill(0.05);
  let level = 0, state = 'idle';

  function draw() {
    bars.shift();
    bars.push(state === 'recording' ? Math.max(0.05, level * (0.7 + Math.random() * 0.6)) : 0.05);
    g.clearRect(0, 0, c.width, c.height);
    const w = c.width / bars.length;
    g.fillStyle = '#20c9b7';
    bars.forEach((v, i) => {
      const h = Math.max(3, Math.min(1, v) * c.height);
      g.fillRect(i * w + 1, (c.height - h) / 2, w - 3, h);
    });
    requestAnimationFrame(draw);
  }
  draw();

  function setMode(mode, text) {
    pill.className = 'pill ' + mode;
    const showMsg = mode === 'error' || mode === 'work';
    msg.style.display = showMsg ? '' : 'none';
    c.style.display = showMsg ? 'none' : '';
    t.style.display = mode === 'error' ? 'none' : '';
    msg.textContent = text || '';
  }

  listen('audio-level', e => {
    level = e.payload.level;
    const s = Math.floor(e.payload.elapsed_ms / 1000);
    t.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  });
  listen('status', e => {
    const p = e.payload;
    if (p.target !== 'paste') return;
    state = p.state;
    if (p.state === 'recording') setMode('rec');
    else if (p.state === 'paused') setMode('rec');
    else if (p.state === 'transcribing') setMode('work', 'Transcribing…');
    else if (p.state === 'loading-model') setMode('work', 'Loading model…');
    else if (p.state === 'error' || p.state === 'no-model') setMode('error', p.message || 'Error');
  });
</script>
</body>
</html>
